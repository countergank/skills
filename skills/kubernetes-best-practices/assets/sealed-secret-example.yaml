# SealedSecret Example — Bitnami SealedSecret Pattern
# Encrypts Kubernetes Secrets for GitOps workflows.
# The SealedSecret can be stored in Git; only the controller in the cluster
# can decrypt it. Requires sealed-secrets controller installed.
# Reference: rules/security/p0-run-as-non-root.md

apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: mongodb-credentials
  namespace: production
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/component: credentials
    app.kubernetes.io/managed-by: sealed-secrets
  annotations:
    sealedsecrets.bitnami.com/cluster-wide: "false"
    sealedsecrets.bitnami.com/namespace-wide: "false"
spec:
  # Scope: Strict (default) — only usable in this namespace with this name
  # Set cluster-wide: "true" above to allow any namespace
  encryptedData:
    # These values are base64-encoded encrypted payloads
    # Generate with: kubeseal --cert <cert> --format yaml < secret.yaml
    MONGODB_ROOT_PASSWORD: AgBy3i4OJSWK+PiTySYZZA9rO43cGDEq...
    MONGODB_USERNAME: AgB4xj5PKTSL+QjUXZZB0sP54dHEFr...
    MONGODB_PASSWORD: AgCz5k6QLUTM+RkVYAaC1tQ65eIFGs...
    MONGODB_DATABASE: AgD06l7RMVUN+SlWZBbD2uR76fJGHt...
  template:
    type: Opaque
    metadata:
      name: mongodb-credentials
      namespace: production
      labels:
        app.kubernetes.io/name: mongodb
        app.kubernetes.io/component: credentials
    # Data keys that will appear in the decrypted Secret
    data:
      MONGODB_ROOT_PASSWORD: ""
      MONGODB_USERNAME: ""
      MONGODB_PASSWORD: ""
      MONGODB_DATABASE: ""

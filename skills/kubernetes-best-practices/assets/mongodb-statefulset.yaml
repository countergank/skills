# MongoDB StatefulSet Template — Production Configuration
# Uses MongoDB Community Operator pattern.
# Includes: PDB, TLS, PVC Retain, anti-affinity.
# Backups: see rules/mongodb/p1-backup-schedule.md (no sidecar included in this template).
# Reference: rules/mongodb/p0-persistent-storage.md
#            rules/mongodb/p0-statefulset-required.md
#            rules/mongodb/p0-auth-enabled.md
#            rules/mongodb/p1-backup-schedule.md
#            rules/mongodb/p1-anti-affinity.md
#            rules/mongodb/p1-tls-required.md

---
# Pod Disruption Budget (P0 reliability)
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mongodb-pdb
  namespace: production
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/component: database
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: mongodb

---
# MongoDB Community Operator resource
apiVersion: mongodbcommunity.mongodb.com/v1
kind: MongoDBCommunity
metadata:
  name: mongodb
  namespace: production
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/instance: mongodb-prod
    app.kubernetes.io/version: "7.0.5"
    app.kubernetes.io/component: database
    app.kubernetes.io/managed-by: mongodb-community-operator
spec:
  # P0: StatefulSet required (operator creates it internally)
  members: 3
  type: ReplicaSet
  version: "7.0.5"

  # P0: Authentication enabled
  security:
    authentication:
      modes: ["SCRAM"]
    # P1: TLS required
    tls:
      enabled: true
      certificateKeySecretRef:
        name: mongodb-tls
      caConfigMapRef:
        name: mongodb-ca

  # P0: Persistent storage with Retain
  persistent: true
  storage:
    storageClass: "gp3-retain"
    volumeClaimTemplate:
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi
        storageClassName: gp3-retain
        # Retain policy — set on the StorageClass, documented here
        # reclaimPolicy: Retain

  # P1: Anti-affinity (spread across nodes/zones)
  statefulSet:
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: mongodb
                topologyKey: topology.kubernetes.io/zone
            - weight: 50
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: mongodb
                topologyKey: kubernetes.io/hostname
      template:
        spec:
          # P1: Do not mount the service account token into the database pod
          automountServiceAccountToken: false
          # P0: Security defaults
          # Note: securityContext fields inside a MongoDBCommunity CR depend on
          # how the operator merges this pod template.
          securityContext:
            runAsNonRoot: true
            runAsUser: 2000
            fsGroup: 2000
          containers:
            - name: mongod
              # P0/P1: Container security hardening
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
                seccompProfile:
                  type: RuntimeDefault
              # P1: Cap WiredTiger cache at ~50% of the 2Gi memory limit
              args:
                - --wiredTigerCacheSizeGB=1
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  cpu: "2"
                  memory: 2Gi
              # Writable paths required by mongod on a read-only root filesystem
              # (data itself lives on the operator-managed PVC, not here)
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: var-run
                  mountPath: /var/run
              # P0: Probes (distinct: liveness = process alive, readiness = ready to serve)
              # Note: this readiness check is intentionally unauthenticated — this
              # template wires no credentials Secret. An authenticated check requires
              # wiring the credentials Secret (e.g., via secretKeyRef env vars).
              readinessProbe:
                exec:
                  command:
                    - mongosh
                    - --quiet
                    - --eval
                    - "db.runCommand({ hello: 1 }).ok"
                initialDelaySeconds: 10
                periodSeconds: 10
                failureThreshold: 3
              livenessProbe:
                exec:
                  command:
                    - mongosh
                    - --eval
                    - "db.adminCommand('ping')"
                initialDelaySeconds: 30
                periodSeconds: 20
                failureThreshold: 5
          volumes:
            - name: tmp
              emptyDir: {}
            - name: var-run
              emptyDir: {}
